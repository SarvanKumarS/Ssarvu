<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Multiplier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container" aria-live="polite">
    <h1>Simple Multiplier</h1>

    <form id="multForm" class="card" aria-describedby="resultLabel">
      <div class="field">
        <label for="a">Number A</label>
        <input type="number" id="a" name="a" step="any" required inputmode="decimal" />
      </div>

      <div class="field">
        <label for="b">Number B</label>
        <input type="number" id="b" name="b" step="any" required inputmode="decimal" />
      </div>

      <div class="buttons">
        <button type="submit" id="multiply">Multiply</button>
        <button type="button" id="clear">Clear</button>
      </div>
    </form>

    <div id="result" class="result" role="status" aria-atomic="true">
      <p id="resultLabel">Result: <span id="value">—</span></p>
    </div>

    <p class="note">Tip: you can press Enter in any input to multiply.</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
